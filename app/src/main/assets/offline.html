<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUPID AI - Offline</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0F172A;
            color: #F8FAFC;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: #1E293B;
            border-radius: 24px;
            padding: 40px 24px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }
        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(239, 68, 68, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .icon-box svg {
            width: 40px;
            height: 40px;
            fill: #EF4444;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #F8FAFC;
        }
        p {
            font-size: 14px;
            line-height: 1.5;
            color: #94A3B8;
            margin-bottom: 28px;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-box">
            <svg viewBox="0 0 24 24">
                <path d="M23.64 7c-.45-.34-4.93-4-11.64-4-1.5 0-2.89.19-4.15.48L18.18 13.8 23.64 7zM3.27 1.44L2 2.72l2.05 2.06C1.91 5.76.59 6.68.36 6.87l11.63 14.49 4.8-5.99 4.48 4.48 1.27-1.27L3.27 1.44z"/>
            </svg>
        </div>
        <h1>Connection Disconnected</h1>
        <p>STUPID AI could not reach the server. Please check your network connection. Your sessions and progress remain saved.</p>
        <button class="btn" onclick="retryConnection()">Retry Connection</button>
    </div>

    <script>
        function retryConnection() {
            window.location.href = "https://ai-website-xi-lac.vercel.app/";
        }
    </script>
</body>
</html>
