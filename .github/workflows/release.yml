name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g., v1.0.0)'
        required: false
        default: ''
      release_title:
        description: 'Title for the release'
        required: false
        default: ''

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare environment configuration
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release-custom.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release-custom.jks" >> $GITHUB_ENV
          elif [ -f my-upload-key.jks ]; then
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
          else
            keytool -genkeypair -v -keystore my-upload-key.jks \
              -alias upload -keypass android -storepass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=STUPID AI, OU=Release, O=STUPID AI, L=City, ST=State, C=US"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release APK Artifact
        run: |
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          if [ -z "$RELEASE_APK" ] || [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Release APK not found!"
            exit 1
          fi

          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "master" ]; then
            TAG="v1.0.0-$(date +'%Y%m%d%H%M')"
          fi

          mkdir -p release-artifacts
          cp "$RELEASE_APK" "release-artifacts/STUPID_AI-${TAG}.apk"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "RELEASE_APK_FILE=release-artifacts/STUPID_AI-${TAG}.apk" >> $GITHUB_ENV
          echo "Prepared release artifact: release-artifacts/STUPID_AI-${TAG}.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stupid-ai-release-${{ env.RELEASE_TAG }}
          path: ${{ env.RELEASE_APK_FILE }}
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ github.event.inputs.release_title || env.RELEASE_TAG }}
          files: ${{ env.RELEASE_APK_FILE }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
