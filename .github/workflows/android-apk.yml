name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Select build variant'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'debug'
          - 'both'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare environment configuration
        run: |
          echo "Checking environment files..."
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
              echo "Created .env from .env.example"
            else
              touch .env
              echo "Created empty .env"
            fi
          fi

      - name: Setup Debug Keystore
        run: |
          echo "Configuring debug keystore..."
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore from debug.keystore.base64"
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -alias androiddebugkey -keypass android -storepass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated new debug.keystore"
          else
            echo "debug.keystore already present"
          fi

      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "Configuring release signing keystore..."
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release-custom.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release-custom.jks" >> $GITHUB_ENV
            echo "Using custom keystore from repository secrets"
          elif [ -f my-upload-key.jks ]; then
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "Using repository upload keystore: my-upload-key.jks"
          else
            keytool -genkeypair -v -keystore my-upload-key.jks \
              -alias upload -keypass android -storepass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=STUPID AI, OU=Release, O=STUPID AI, L=City, ST=State, C=US"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "Generated fallback release keystore"
          fi

      - name: Build APK with Gradle
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          BUILD_VARIANT: ${{ github.event.inputs.build_variant || 'both' }}
        run: |
          echo "Selected build variant: $BUILD_VARIANT"
          case "$BUILD_VARIANT" in
            "release")
              echo "Building Release APK..."
              ./gradlew assembleRelease --stacktrace
              ;;
            "debug")
              echo "Building Debug APK..."
              ./gradlew assembleDebug --stacktrace
              ;;
            "both")
              echo "Building both Release and Debug APKs..."
              ./gradlew assembleRelease assembleDebug --stacktrace
              ;;
            *)
              echo "Defaulting to Release and Debug APKs..."
              ./gradlew assembleRelease assembleDebug --stacktrace
              ;;
          esac

      - name: Verify and list generated APKs
        run: |
          echo "Searching for generated APK files..."
          FOUND_APKS=$(find app/build/outputs/apk -name "*.apk" -type f)
          if [ -z "$FOUND_APKS" ]; then
            echo "::error::No APK files were generated in app/build/outputs/apk!"
            exit 1
          fi
          echo "Generated APK files:"
          ls -lh app/build/outputs/apk/*/*.apk

      - name: Upload Main APK Artifact (android-apk)
        uses: actions/upload-artifact@v5
        with:
          name: android-apk
          path: app/build/outputs/apk/*/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Release APK (android-release-apk)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Debug APK (android-debug-apk)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: ignore
